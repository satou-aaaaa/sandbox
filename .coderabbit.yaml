# CodeRabbit（GitHub アプリ）の設定。PR に2人目のレビューを付ける
# （2026-10-18 satou さん承認。公開リポジトリは Open source プランで無料）。
# 書式: https://docs.coderabbit.ai/reference/configuration
language: ja-JP
tone_instructions: "短く書く。指摘には、どの入力・どの手順でどう壊れるかを書く。好みの書き方・整形は指摘しない。"
early_access: false
reviews:
  # chill: 細かい好みの指摘でエージェントの手を止めない
  profile: chill
  request_changes_workflow: false
  high_level_summary: false
  poem: false
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: false
  estimate_code_review_effort: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  auto_review:
    enabled: true
    # エージェントは下書きで作業するので、下書きのうちに見てもらう
    drafts: true
  path_filters:
    - "!package-lock.json"
    - "!agent/package-lock.json"
    - "!CHANGELOG.md"
  path_instructions:
    - path: "**"
      instructions: |
        - このリポジトリの PR は Claude のエージェントが作り、CI が緑なら人の確認なしにマージされる。
          だから、動きの誤り・データが壊れる・セキュリティ・テストや検査の抜けを優先して指摘する。
        - 好みの書き方・言い回し・細かい整形は指摘しない（整形とリンターは CI が見る）。
        - 指摘には、どの入力・どの手順でどう壊れるかを1〜2文で書く。たどれない推測は書かない。
        - コメントや画面の文言の言い回し・言語を変える提案はしない（言葉選びは持ち主が決めている）。
        - ビルドレス（TypeScript のコンパイルを入れない）、外部へ個人情報を送らない、判定・期限計算には法令の根拠 URL を書く、DB を入れない、が変えてはならない前提（`CLAUDE.md`）。これに反する変更は HIGH 以上で指摘する。
        - 顧客の実データ（氏名・住所・財務情報）らしいものがコード・テスト・文書に入っていたら CRITICAL で指摘する。
chat:
  # エージェントが理由を返すたびに返事をしない（呼ばれたときだけ答える）
  auto_reply: false
