name: Weekly mutation

# ミューテーションテスト（Stryker）を週次で実行し、生き残りミュータントの要約をジョブサマリーと
# 常設Issue（ラベル mutation-report）に出す（ADR-0018）。CIの必須チェックには含めず、閾値による失敗もしない。
# 時間がかかるため（数分〜数十分。stryker.config.mjs 参照）、PRごとではなく週次にしている。
on:
  schedule:
    # 毎週日曜 03:00 JST（= 土曜 18:00 UTC）
    - cron: "0 18 * * 6"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-mutation
  cancel-in-progress: false

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: ミューテーションテスト
        run: npx stryker run --reporters json,clear-text
      - name: 生き残りの要約
        shell: bash
        run: |
          node scripts/mutation-summary.mjs reports/mutation/mutation.json | tee mutation-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: 常設Issueに集約
        shell: bash
        run: scripts/gh-upsert-issue.sh mutation-report "ミューテーションテスト週次結果（自動投稿）" mutation-summary.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
