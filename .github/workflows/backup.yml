name: Backup

# リポジトリの全履歴（全ブランチ・タグ）を git bundle にして、週1回アーティファクトへ保存する（#126。ADR-0017 Amendment 26）。
# GitHubのリポジトリ自体が失われた場合の復元用（手順は docs/BACKUP.md）。保存期間は90日（アーティファクトの上限）。
# Issue・PRのコメント・ラベル等はgitの履歴に含まれない（必要なら `gh issue list --json` で別途書き出す）。
on:
  schedule:
    - cron: "17 18 * * 0" # 毎週日曜 18:17 UTC（月曜3:17 JST）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: bundle を作成して検証する
        run: |
          git fetch --tags --force
          git bundle create repo.bundle --all
          git bundle verify repo.bundle
          ls -l repo.bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: repo-bundle
          path: repo.bundle
          retention-days: 90
          if-no-files-found: error
