name: Agent PR auto-merge

# エージェントが作ったPR（ブランチ名 agent/issue-<番号>。取消のリバートPRは revert/pr-<番号>）のマージ判断を、リスクに応じて自動化する。
# （クラウド実行では、自動マージの予約がGraphQL専用のため行えない。この workflow が代わりに予約する）
#  - 原則は自動マージ（人手を介さない）: 文書・テスト・法令ロジックを含まないコード（12ファイル以下）は、
#    必須チェック成功後に自動マージする。問題があれば事後にリバートする（ADR-0017 Amendment 10）
#  - 人手（または承認）に回す領域: 保護パス、法令判定・期限計算・様式生成（既定。変数 AGENT_AUTOMERGE_LEGAL=true で自動マージ可）、設定・設計文書など。
#    理由をコメントし、`agent-approved` ラベル（所有者、またはAIレビュアーが所有者の権限で付与）で必須チェック成功後に自動マージ
# 実際のマージは Ruleset `protect-main` の必須チェック（Test・CodeQL）が全て成功した時点でGitHubが行う。
#
# 安全策:
#  - リスク分類は「PRのコード」ではなく「baseのコード」をチェックアウトして実行する
#    （PR自身が分類ロジックを書き換えて自己承認できないように）
#  - 対象は同一リポジトリのブランチのみ。承認ラベルは所有者が付けた場合のみ有効
#  - 権限は最小（contents: write と pull-requests: write）
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  decide:
    if: github.event.pull_request.head.repo.full_name == github.repository && (startsWith(github.event.pull_request.head.ref, 'agent/issue-') || startsWith(github.event.pull_request.head.ref, 'revert/pr-'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: baseのコードをチェックアウト（分類ロジックをPRから隔離）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: リスクを分類して、マージまたは人手に回す
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
          SENDER: ${{ github.event.sender.login }}
          OWNER: ${{ github.repository_owner }}
          # 法令判定・期限計算の領域を自動マージ対象にするか（既定は false＝承認ラベルを要する）
          AGENT_AUTOMERGE_LEGAL: ${{ vars.AGENT_AUTOMERGE_LEGAL }}
        run: |
          set -euo pipefail
          RISK="$(node agent/pr-risk.mjs "$PR_NUMBER")"
          LEVEL="$(printf '%s' "$RISK" | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0,"utf8")).level)')"
          REASONS="$(printf '%s' "$RISK" | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0,"utf8")).reasons.map((r) => "- " + r).join("\n"))')"
          echo "リスク: $LEVEL"
          APPROVED=false
          if [ "$EVENT_ACTION" = "labeled" ] && [ "$LABEL_NAME" = "agent-approved" ] && [ "$SENDER" = "$OWNER" ]; then
            APPROVED=true
          fi
          if [ "$LEVEL" = "low" ] || [ "$APPROVED" = "true" ]; then
            gh pr merge "$PR_NUMBER" --auto --squash
            echo "自動マージを予約しました（必須チェック成功後にマージされます）"
          else
            # 同じ説明を何度も投稿しない（synchronize のたびに重複させない）
            if ! gh pr view "$PR_NUMBER" --json comments --jq '.comments[].body' | grep -q "agent-pr-automerge:needs-review"; then
              MARKER='<!-- agent-pr-automerge:needs-review -->'
              HEAD_MSG='このPRは自動マージの対象外（人手のレビューが必要）です。理由:'
              TAIL_MSG='内容を確認して問題なければ「agent-approved」ラベルを付けてください。必須チェック成功後に自動でマージされます。'
              BODY="$(printf '%s\n\n%s\n%s\n\n%s' "$MARKER" "$HEAD_MSG" "$REASONS" "$TAIL_MSG")"
              gh pr comment "$PR_NUMBER" --body "$BODY"
            fi
            gh pr edit "$PR_NUMBER" --add-label agent-needs-review || true
          fi
