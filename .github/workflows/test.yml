name: Test

on:
  push:
    branches: [main]
  pull_request:

# GITHUB_TOKENの権限を必要最小限に絞る（サプライチェーン攻撃対策の基本）。
# 本ワークフローはチェックアウトしてテストを実行するのみで、コンテンツの
# 書き込みやIssue/PR操作は行わないため read のみで足りる。
permissions:
  contents: read

# 同じブランチ・PRへの連続pushでは、古い実行中のジョブを自動キャンセルする
# （Actions利用時間の節約）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # まれなハング状態でActions利用時間を無駄に消費するのを防ぐ。
    # ubuntu・22.xのセルはPlaywrightのブラウザインストールが加わり時間が
    # 伸びるため、他セルより若干余裕を持たせている。
    timeout-minutes: 15
    strategy:
      # 1つのOS/Node.jsバージョンで失敗しても、他の組み合わせの結果も
      # 確認できるよう最後まで実行する（診断のしやすさを優先）。
      fail-fast: false
      matrix:
        # 開発機がWindowsであるため、Windows環境も対象に含める
        # （改行コード・パス区切り文字関連のバグをubuntu限定のCIでは
        # 見逃すリスクがあったため。過去に.gitattributesでの改行コード
        # 対応が必要になった経緯を踏まえた対応）。
        os: [ubuntu-latest, windows-latest]
        node-version: [20.x, 22.x]
        # 【2026年9月・ベストプラクティス監査第7回】Windows runnerはUbuntuの
        # 2倍の課金倍率。Windows環境を含める目的（OS依存バグの検出）は
        # Node.jsのメジャーバージョンにはほぼ依存しないため、windows-latest
        # は22.xの1系統のみに絞り、20.x分を除外してActions利用時間を削減する
        # （発注者の判断により対応。docs/BEST_PRACTICES_AUDIT.md §6参照）。
        exclude:
          - os: windows-latest
            node-version: 20.x
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # ubuntu・22.xのジョブは直後に `npm run test:coverage` で同じ200件を
      # カバレッジ計測付きで再実行する（合否件数もそちらで確認できる）ため、
      # そのセルだけは同一テストの二重実行を避けるためこのステップを省略する。
      - name: npm test
        if: "!(matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x')"
        run: npm test
      # --experimental-test-coverage には Node 20 系で誤って例外を投げる既知の不具合があるため、
      # 22.x のジョブでのみ実行する。結果はOSに依存しないため ubuntu の1系統のみで足りる。
      # テスト件数・カバレッジ数値をActionsのジョブサマリーにも出力し、ログを
      # 開かなくても概要を確認できるようにする。
      - name: テストカバレッジ計測とサマリー出力
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        shell: bash
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee coverage-output.txt
          # Node.jsのテストランナーはTTY接続時は"ℹ "、CI等の非TTY環境では"# "を
          # 診断行の接頭辞に使う（reporterの自動切り替え）ため、両方にマッチさせる。
          # 【注意】文字クラス構文 `[ℹ#]` はロケール未設定（LANG/LC_ALLが
          # 空のCロケール。GitHub Actions含め多くのCI環境で実際に起こる）だと
          # マルチバイト文字を正しく1文字として扱えず無言でマッチに失敗する
          # （このため本サマリーが常に空欄になっていた不具合が過去にあった）。
          # 文字クラスではなく `(ℹ|#)` の選択（alternation）を使うことで、
          # ロケール設定に依存せず確実にマッチさせる。
          {
            echo '## テストカバレッジサマリー'
            echo
            echo '```'
            grep -E '^(ℹ|#) (tests|pass|fail|cancelled|skipped|todo|all files)' coverage-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # シークレット混入チェック（hooks/check-secrets.mjs）をCI側でも実行する。
      # ローカルのpre-commitフックは `git commit --no-verify` でバイパスできる・
      # そもそも `git config core.hooksPath hooks` を設定していない環境からの
      # pushには効かないため、CI側での二重の安全網として全ファイルを対象に
      # 再チェックする。GitHub純正のシークレットスキャンは非公開リポジトリの
      # 現プラン（GitHub Free）では利用できないため確認済み（2026年9月）。
      # 結果はOSに依存しないため ubuntu の1系統のみで足りる。
      - name: シークレット混入チェック（CI側の安全網）
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        run: npm run check-secrets
      # 依存パッケージの既知脆弱性チェック。package-lock.jsonのみに依存する結果であり
      # OS・Node.jsバージョンいずれにも依存しないため、ubuntu・22.xの1系統のみで足りる。
      - name: npm audit（高深刻度以上）
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        run: npm audit --audit-level=high
      # npmレジストリ上のパッケージ署名を検証する（サプライチェーン改ざん対策）。
      # 同上の理由でubuntu・22.xの1系統のみで足りる。
      # 【既知の問題】npmレジストリ側のSigstore署名添付（attestation）取得APIが
      # 一時的に応答しないことがあり、`@playwright/test`等でEMISSINGSIGNATUREKEYと
      # なって本ステップだけが単発で失敗する事象が複数のPRで発生した（他の
      # 全ステップは毎回成功しており、実際の署名不備ではなくレジストリ側の
      # 一時的な取得失敗と判断）。手動でのジョブ再実行で毎回解消していたため、
      # `continue-on-error` で結果を無視する（本物の署名不備も見逃してしまう）
      # のではなく、コマンド自体を3回まで再試行する形でCI側の安定性を上げる。
      - name: npmパッケージ署名の検証
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        shell: bash
        run: |
          for i in 1 2 3; do
            npm audit signatures && exit 0
            echo "npm audit signatures が失敗しました（${i}回目）。レジストリ側の一時的な応答不良の可能性があるため再試行します。"
            sleep 10
          done
          exit 1
      # E2Eテスト（Playwright）。ブラウザバイナリのダウンロードを伴い実行時間も
      # 長いため、他の「OS非依存」チェックと同じくubuntu・22.xの1系統のみで
      # 実行する（アプリ側はOS依存の分岐が無いHTTPサーバーのため、複数OSで
      # 重複実行する価値は薄いと判断。ADR-0012参照）。
      - name: Playwrightブラウザのインストール
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        run: npx playwright install --with-deps chromium
      - name: E2Eテスト
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        run: npm run test:e2e
      # 負荷テスト（autocannon）。厳密な性能閾値は判定せず、同時リクエスト下で
      # エラー・タイムアウト・5xxが発生しないことのみを確認する（ADR-0013参照）。
      # 共有CIランナーの性能は変動するため、具体的なレイテンシ数値でのpass/fail
      # 判定はせず「壊れずに応答できるか」に絞ることでCI環境でも安定して
      # 実行できるようにしている。他の「OS非依存」チェックと同じくubuntu・
      # 22.xの1系統のみで実行する。
      - name: 負荷テストとサマリー出力
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        shell: bash
        run: |
          set -o pipefail
          npm run test:load 2>&1 | tee load-test-output.txt
          {
            echo '## 負荷テスト結果'
            echo
            echo '```'
            # server.jsのアクセスログ（1リクエストごとの `GET /path -> 200 (Nms)` 行）
            # は同時アクセス数分（数百行）出力され読みづらいため除外し、
            # シナリオ見出し・レイテンシ/スループットの集計テーブル・
            # 最終結果メッセージのみをサマリーに残す。
            grep -vE '^(GET|POST) ' load-test-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
