name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # --experimental-test-coverage には Node 20 系で誤って例外を投げる既知の不具合があるため、
      # 22.x のジョブでのみ情報表示として実行する（閾値による失敗判定はしない）。
      - if: matrix.node-version == '22.x'
        run: npm run test:coverage
      - name: npm audit（高深刻度以上）
        run: npm audit --audit-level=high
