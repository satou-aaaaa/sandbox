name: Agent on ready

# Issueに agent-ready ラベルが付いたら、次の定期実行を待たずにそのIssueだけを即時に処理する（ADR-0017 Amendment 18）。
# 有効化は agent-cycle.yml と同じ（シークレット2つ + リポジトリ変数 AGENT_CYCLE_ENABLED=true）。
# 未設定・false の間は何もしない。定期実行（cycle）が取りこぼしを拾うため、これは「速さ」のための追加経路。
#
# 【ラベルでの即時実行は外している（2026-10-16）】
#  Actions 用の鍵（AGENT_GH_TOKEN）が無効になり、10/15 はラベルを付けるたびに checkout で失敗していた。
#  処理はルーティン「運用エージェント」が拾うので、ここは手動実行だけ残す（agent-cycle.yml と同じ扱い）。
#  鍵を作り直してラベルでの即時実行に戻すときは、下の on: に issues: types: [labeled] を戻す。
on:
  workflow_dispatch:
    inputs:
      issue:
        description: "処理するIssue番号"
        required: true
        type: number

# サイクル・他のIssueの処理と同時に走らせない（二重処理の防止）
concurrency:
  group: agent-cycle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    # 所有者本人が agent-ready を付けたときだけ（第三者のラベル操作では動かさない）
    if: github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      AGENT_SANDBOX: docker
      AGENT_AUTH: subscription
    steps:
      - name: シークレットの存在を確認
        run: |
          missing=0
          if [ -z "$GH_TOKEN" ]; then echo "::error::シークレット AGENT_GH_TOKEN が未設定です"; missing=1; fi
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo "::error::シークレット CLAUDE_CODE_OAUTH_TOKEN が未設定です"; missing=1; fi
          exit "$missing"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.AGENT_GH_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: エージェントの依存をインストール
        working-directory: agent
        run: npm ci --no-audit --no-fund
      - name: コミット用の識別情報を設定
        run: |
          git config user.name "kensetsu-agent"
          git config user.email "kensetsu-agent@users.noreply.github.com"
      - name: 対象のIssueだけを処理
        env:
          ISSUE_NUMBER: ${{ inputs.issue }}
        run: node agent/run.mjs --issue "$ISSUE_NUMBER"
