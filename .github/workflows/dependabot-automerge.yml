name: Dependabot auto-merge

# Dependabotが作成したPRのうち、メジャーバージョンでない更新（patch/minor）に
# 限って自動マージを予約する。実際のマージは、Ruleset `protect-main` の必須
# チェック（Test・CodeQL）がすべて成功した時点でGitHubが行う（失敗すれば
# マージされない）。メジャー更新は破壊的変更を含み得るため人手レビューに回す。
# Dependabotは依存の更新のみを行い、法令判定ロジックを書き換えることはない。
# 中身は共通部品 satou-aaaaa/shared-workflows にある。
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    uses: satou-aaaaa/shared-workflows/.github/workflows/dependabot-automerge.yml@main
